<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Map Voyager - Enhanced Engine</title>

  <!-- Critical CSS to prevent FOUC -->
  <style>
    /* Apply dark mode immediately before Tailwind loads */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0f172a !important;
      color: #e5e7eb !important;
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a !important;
    }

    /* Hide content until styles are fully loaded */
    #root > * {
      visibility: visible;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    html {
        overflow-x: hidden;
    }

    /* Safe area insets for iPhone notch/home indicator */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }

    /* FF6-Style Combat Variables - Light mode defaults */
    :root {
      --ff-bg: radial-gradient(circle at top, rgba(248, 246, 243, 0.98) 0%, rgba(243, 241, 237, 0.95) 60%, rgba(239, 236, 234, 0.92) 100%);
      --ff-border: #BCBAB5;
      --ff-border-glow: rgba(90, 155, 140, 0.3);
      --ff-button-bg: linear-gradient(145deg, #FAFAF8, #F3F1ED);
      --ff-button-hover-bg: linear-gradient(145deg, #F8F6F3, #EFECEA);
      --ff-text: #1a1a1a;
      --ff-header-text: #5A9B8C;
      --panel-bg: rgba(250, 250, 248, 0.95);
      --panel-border: rgba(212, 209, 204, 0.6);
      --toast-bg: linear-gradient(145deg, #5A9B8C, #4D8577);
      --modal-overlay-bg: rgba(248, 246, 243, 0.85);
      --sidebar-border-color: rgba(212, 209, 204, 0.3);
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      /* Hide scrollbars on mobile for cleaner look */
      .scrollbar-thin::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }

      /* Prevent pull-to-refresh and overscroll */
      body {
        overscroll-behavior: none;
      }

      /* Improve touch scrolling */
      * {
        -webkit-overflow-scrolling: touch;
      }

      /* Disable text selection on UI elements */
      button, .no-select {
        -webkit-user-select: none;
        user-select: none;
      }

      /* Prevent tap highlight on iOS */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    }

    /* Mobile bottom sheet animation */
    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-slideUp {
      animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* Dark mode combat overrides */
    html.dark {
      --ff-bg: radial-gradient(circle at top, rgba(30, 64, 175, 0.9) 0%, rgba(17, 24, 39, 0.95) 60%, rgba(15, 23, 42, 0.98) 100%);
      --ff-border: #4f8fef;
      --ff-border-glow: rgba(96, 165, 250, 0.5);
      --ff-button-bg: linear-gradient(145deg, #1e40af, #2563eb);
      --ff-button-hover-bg: linear-gradient(145deg, #2563eb, #3b82f6);
      --ff-text: #e5e7eb;
      --ff-header-text: #fbbf24;
      --panel-bg: rgba(30, 41, 59, 0.99);
      --panel-border: rgba(71, 85, 105, 0.8);
      --toast-bg: linear-gradient(145deg, #1e3a8a, #312e81);
      --modal-overlay-bg: rgba(15, 23, 42, 0.9);
      --sidebar-border-color: rgba(255,255,255,0.1);
    }
    
    /* Enhanced Scrollbar Styling */
    .scrollbar-thin { 
      scrollbar-width: thin; 
    }
    
    .dark .scrollbar-thin { 
      scrollbar-color: rgba(96, 165, 250, 0.6) rgba(30, 41, 59, 0.5); 
    }
    
    .light .scrollbar-thin { 
      scrollbar-color: rgba(148, 163, 184, 0.7) rgba(226, 232, 240, 0.5); 
    }
    
    .scrollbar-thin::-webkit-scrollbar { 
      width: 8px; 
      height: 8px; 
    }
    
    .dark .scrollbar-thin::-webkit-scrollbar-track { 
      background: rgba(30, 41, 59, 0.5); 
      border-radius: 4px; 
    }
    
    .dark .scrollbar-thin::-webkit-scrollbar-thumb { 
      background-color: rgba(96, 165, 250, 0.6); 
      border-radius: 4px; 
      border: 1px solid rgba(15, 23, 42, 0.5); 
    }
    
    .dark .scrollbar-thin::-webkit-scrollbar-thumb:hover { 
      background-color: rgba(96, 165, 250, 0.8); 
    }
    
    .light .scrollbar-thin::-webkit-scrollbar-track { 
      background: rgba(226, 232, 240, 0.5); 
      border-radius: 4px; 
    }
    
    .light .scrollbar-thin::-webkit-scrollbar-thumb { 
      background-color: rgba(148, 163, 184, 0.7); 
      border-radius: 4px; 
      border: 1px solid rgba(248, 250, 252, 0.5); 
    }
    
    .light .scrollbar-thin::-webkit-scrollbar-thumb:hover { 
      background-color: rgba(100, 116, 139, 0.8); 
    }
    
    /* Enhanced Text Effects */
    .text-glow-amber { 
      text-shadow: 0 0 8px rgba(251, 191, 24, 0.6), 0 0 12px rgba(251, 191, 24, 0.4); 
    }

    /* Prevent layout shifts during loading */
    * {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Enhanced loading states */
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .7;
      }
    }

    /* Modern Button System */
    .ff-action-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.65rem 1.45rem;
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      border: 1px solid var(--button-primary-border);
      border-radius: 0.75rem;
      font-family: var(--font-ui, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.015em;
      text-transform: none;
      box-shadow: var(--button-primary-shadow);
      transition: background-color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .ff-action-button:hover {
      background: var(--button-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 20px 38px rgba(15, 23, 42, 0.2);
    }

    .ff-action-button:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
    }

    .ff-action-button:disabled {
      background: rgba(148, 163, 184, 0.22);
      color: rgba(148, 163, 184, 0.72);
      border-color: rgba(148, 163, 184, 0.22);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      filter: saturate(0.6);
    }

    /* Enhanced Modal System */
    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      z-index: 50; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background-color: var(--modal-overlay-bg); 
     
      animation: modalFadeIn 0.1s ease-out forwards; 
    }
    
    .ff-panel { 
      background: var(--ff-bg); 
      border: 2px solid var(--ff-border); 
      border-radius: 0.75rem; 
      box-shadow: 0 0 35px var(--ff-border-glow), inset 0 0 15px rgba(96, 165, 250, 0.3), 0 25px 50px -12px rgba(0, 0, 0, 0.3); 
      color: var(--ff-text); 

      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; 
    
      transition: all 0.1s ease;
    }
    
    .ff-panel:hover {
      /* Removed hover transform and enhanced shadow to prevent wiggle/movement */
    }

    /* marketplacebanner helper */

.marketplace-banner-wrap { isolation: isolate; }
.marketplace-banner-wrap svg { isolation: isolate; }
    
    /* Enhanced Combat System */
    .combat-modal-wrapper { 
        position: fixed; 
        inset: 0; 
        z-index: 60; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background-color: rgba(15, 23, 42, 0.85); 
        backdrop-filter: blur(4px);
        animation: modalFadeIn 0.5s ease-out; 
        font-family: 'Press Start 2P', cursive;
    }

    .combat-screen-fx-wrapper { 
        position: relative; 
        width: 100vw; 
        height: 100vh; 
        overflow: hidden; 
    }
    
    .combat-stage {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30vh;
        background: radial-gradient(ellipse at 50% 100%, rgba(30, 41, 59, 0.7) 0%, rgba(30, 41, 59, 0.3) 50%, transparent 70%);
        pointer-events: none;
    }

    .combat-scene { 
        display: flex; 
        justify-content: space-around; 
        align-items: flex-end; 
        height: 100%; 
        padding-bottom: 25vh;
    }

    .combatant-sprite-wrapper {
        position: relative;
        width: 256px;
        height: 256px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
     .combat-log-panel {
        position: absolute;
        bottom: 12rem;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 3rem);
        max-width: 900px;
        height: 8rem;
        padding: 1rem;
        background: var(--ff-bg);
        border: 2px solid var(--ff-border);
        border-radius: 0.75rem;
        box-shadow: 0 0 20px var(--ff-border-glow);
        color: var(--ff-text);
    }

    .combat-ui-panel {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 3rem);
        max-width: 900px;
        height: 10rem;
        padding: 0; /* No padding on the container itself */
        background: var(--ff-bg);
        border: 2px solid var(--ff-border);
        border-radius: 0.75rem;
        box-shadow: 0 0 20px var(--ff-border-glow);
    }

    .combat-command-grid {
        position: relative;
        display: grid;
        gap: 0.75rem 1.5rem;
        padding: 1rem;
        grid-template-columns: repeat(3, 1fr);
        height: 100%;
        background: rgba(17, 24, 39, 0.8);
        border-radius: 0.5rem;
    }

    .combat-command-button {
        background: transparent;
        color: white;
        font-family: 'Press Start 2P', cursive;
        font-size: 0.8rem;
        border: none;
        transition: all 0.2s ease;
        cursor: pointer;
        text-align: left;
        display: flex;
        align-items: center;
    }

    .ff-pointer {
        position: absolute;
        width: 24px;
        height: 24px;
        background-image: url('data:image/svg+xml;utf8,<svg fill="%23fbbf24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M 5 3 L 5 5 L 3 5 L 3 7 L 5 7 L 5 9 L 3 9 L 3 11 L 5 11 L 5 13 L 3 13 L 3 15 L 5 15 L 5 17 L 3 17 L 3 19 L 5 19 L 5 21 L 7 21 L 7 19 L 9 19 L 9 17 L 7 17 L 7 15 L 11 15 L 11 13 L 7 13 L 7 11 L 13 11 L 13 9 L 7 9 L 7 7 L 9 7 L 9 5 L 7 5 L 7 3 Z M 13 9 L 21 13 L 13 17 Z" /></svg>');
        background-size: contain;
        background-repeat: no-repeat;
        animation: ff6-pointer-bob 0.7s ease-in-out infinite;
        image-rendering: pixelated;
        pointer-events: none;
        filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.8));
        z-index: 10;
        transition: top 0.1s ease-out, left 0.1s ease-out;
    }

    .combat-log-top {
        height: 100%;
        overflow-y: auto;
        font-size: 0.8rem; /* Bigger font size */
        line-height: 1.6;
        color: var(--ff-text);
        font-family: 'Lora', serif;
    }

    .absolute.top-4.left-4, .absolute.top-4.right-4 {
        width: 280px;
        padding: 0.75rem 1rem;
        background: var(--ff-bg);
        border: 2px solid var(--ff-border);
        border-radius: 0.75rem;
        box-shadow: 0 0 15px var(--ff-border-glow), inset 0 0 10px rgba(0,0,0,0.4);
    }
    .absolute.top-4.right-4 { text-align: right; }

    .health-bar-gradient {
        background: linear-gradient(to right, #ef4444, #facc15, #4ade80);
    }

    .contextual-dialogue-panel, .combat-dialogue-box {
        position: absolute;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        max-width: 700px;
        padding: 1rem 1.5rem;
        background: var(--ff-bg);
        border: 2px solid var(--ff-border);
        border-radius: 0.75rem;
        box-shadow: 0 0 25px var(--ff-border-glow);
        z-index: 70;
        font-size: 0.9rem;
        font-family: 'Lora', serif;
        line-height: 1.5;
        color: var(--ff-text);
        animation: popIn 0.4s ease-out;
        text-align: center;
    }

    .status-effect-icon {
        position: absolute;
        bottom: 0rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.5rem;
        text-shadow: 1px 1px 3px black;
    }
    
    .damage-splat { 
        position: absolute; 
        top: 20%; 
        left: 50%; 
        transform: translateX(-50%); 
        font-family: 'Press Start 2P', cursive; 
        font-size: 2rem; 
        text-shadow: 2px 2px 4px black, 0 0 8px rgba(0,0,0,0.8); 
        pointer-events: none; 
        animation: damageSplatAnim 1.6s ease-out forwards; 
        z-index: 100;
    }
    
    .damage-splat.damage { color: white; }
    .damage-splat.crit { color: #facc15; font-size: 2.5rem; text-shadow: 2px 2px 4px black, 0 0 15px #facc15; }
    .damage-splat.heal { color: #4ade80; text-shadow: 2px 2px 4px black, 0 0 10px #4ade80; }
    .damage-splat.miss { color: #9ca3af; font-size: 1.5rem; }
    .damage-splat.status { color: #a78bfa; font-size: 1.2rem; text-shadow: 2px 2px 4px black, 0 0 8px #a78bfa;}
    
    /* Enhanced Animations */
    .glowing-door { animation: glowingDoor 2s ease-in-out infinite; }
    .animated-lava-stop1 { animation: lavaRippleAnimation 6s ease-in-out infinite; }
    .animated-lava-stop2 { animation: lavaRippleAnimation 6s ease-in-out infinite -2s; }
    .animated-lava-stop3 { animation: lavaRippleAnimation 6s ease-in-out infinite -4s; }
    .reef-fish-yellow { animation: reef-fish-swim 4s ease-in-out infinite; animation-delay: var(--fish-delay, 0s); }
    .reef-fish-purple { animation: reef-fish-swim 5s ease-in-out infinite reverse; animation-delay: var(--fish-delay, 0s); }
    .steam-wisp1 { animation: riseSteam 3s ease-out infinite; }
    .bubble1 { animation: bubbleRise 2.5s linear infinite; }
    .animated-circling-bird-v2 { animation: circlingBirdAnimationV2 var(--bird-duration, 14s) linear infinite; animation-delay: var(--bird-delay, 0s); }
    .animate-snow { animation: snow 4s linear infinite; animation-delay: calc(var(--delay, 0) * 0.2s); }
    .animate-rain { animation: rain 1.5s linear infinite; animation-delay: calc(var(--delay, 0) * 0.1s); }
    .animate-smoke { animation: smoke 3s ease-out infinite; animation-delay: calc(var(--delay, 0) * 0.3s); }
    .animate-fall-leaves { animation: fallLeaves 5s ease-out infinite; animation-delay: calc(var(--delay, 0) * 0.5s); }
    .animate-ff6-idle-bob { animation: ff6-idle-bob 2s ease-in-out infinite; transform-origin: center bottom; }
    .animate-skill-glow-pulse { animation: skillGlowPulse 0.8s ease-out forwards; }
    .animate-sprite-flee { animation: spriteFlee 1.2s ease-in forwards; }
    .animate-sprite-defend-bob { animation: ff6-idle-bob 1.5s ease-in-out infinite; }
    
    /* Combat sprite animations */
    .animate-sprite-idle-bob { animation: spriteIdleBob 2s ease-in-out infinite; }
    .animate-sprite-attack-forward { animation: spriteAttackForward 0.5s ease-out; }
    .animate-damaged-recoil { animation: damagedRecoil 0.4s ease-out; }
    .animate-defend-stance { animation: defendStance 0.3s ease-out forwards; }
    .animate-flee-anim { animation: fleeAnim 0.8s ease-in forwards; }
    .animate-item-use-hop { animation: itemUseHop 0.6s ease-out; }
    
    /* Weapon-specific attack animations */
    .animate-sprite-thrust { animation: spriteThrust 0.4s ease-out; }
    .animate-sprite-slash { animation: spriteSlash 0.5s ease-out; }
    .animate-sprite-overhead { animation: spriteOverhead 0.6s ease-out; }
    .animate-sprite-stab { animation: spriteStab 0.3s ease-out; }
    .animate-sprite-swing { animation: spriteSwing 0.7s ease-in-out; }
    .animate-sprite-sweep { animation: spriteSweep 0.5s ease-out; }
    
    .gentle-float { animation: gentle-float 3s ease-in-out infinite; }
    
    .ff-action-button:focus-visible { outline: 2px solid var(--ff-border); outline-offset: 2px; box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.3); }
    
    @keyframes move-twink-back { from { background-position: 0 0; } to { background-position: -10000px 5000px; } }
    
    /* Enhanced Combat sprite keyframes with better easing */
    @keyframes spriteIdleBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(0.5deg); }
    }
    
    @keyframes spriteAttackForward {
      0% { transform: translateX(0) scale(1); }
      20% { transform: translateX(-2px) scale(1.02); } /* Wind-up */
      60% { transform: translateX(15px) scale(0.98); } /* Strike */
      100% { transform: translateX(0) scale(1); } /* Recovery */
    }
    
    @keyframes damagedRecoil {
      0% { transform: translateX(0) rotate(0deg); filter: brightness(1); }
      15% { transform: translateX(-8px) rotate(-2deg); filter: brightness(2.5); }
      40% { transform: translateX(-3px) rotate(-1deg); filter: brightness(1.8); }
      75% { transform: translateX(2px) rotate(1deg); filter: brightness(1.2); }
      100% { transform: translateX(0) rotate(0deg); filter: brightness(1); }
    }
    
    @keyframes defendStance {
      0% { transform: translateY(0) scaleY(1) scaleX(1); }
      100% { transform: translateY(3px) scaleY(0.92) scaleX(1.05); }
    }
    
    @keyframes fleeAnim {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(-20px); opacity: 0.7; }
    }
    
    @keyframes itemUseHop {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-4px); }
      50% { transform: translateY(-2px); }
    }
    
    /* Enhanced weapon-specific attack keyframes */
    @keyframes spriteThrust {
      0% { transform: translateX(0) scale(1); }
      15% { transform: translateX(-3px) scale(1.02); } /* Wind-up */
      50% { transform: translateX(18px) scale(0.95); } /* Extended thrust */
      85% { transform: translateX(12px) scale(1); } /* Hold */
      100% { transform: translateX(0) scale(1); } /* Recovery */
    }
    
    @keyframes spriteSlash {
      0% { transform: rotate(0deg) translateX(0) scale(1); }
      25% { transform: rotate(15deg) translateX(-2px) scale(1.05); } /* Wind-up */
      65% { transform: rotate(-15deg) translateX(8px) scale(0.95); } /* Follow-through */
      100% { transform: rotate(0deg) translateX(0) scale(1); }
    }
    
    @keyframes spriteOverhead {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      20% { transform: translateY(-8px) rotate(-25deg) scale(1.08); } /* Raise */
      40% { transform: translateY(-6px) rotate(-20deg) scale(1.05); } /* Peak */
      70% { transform: translateY(5px) rotate(8deg) scale(0.92); } /* Strike down */
      100% { transform: translateY(0) rotate(0deg) scale(1); } /* Recovery */
    }
    
    @keyframes spriteStab {
      0% { transform: translateX(0) scale(1); }
      20% { transform: translateX(-2px) scale(1.03); } /* Quick wind-up */
      50% { transform: translateX(12px) scale(0.97); } /* Sharp stab */
      100% { transform: translateX(0); }
    }
    
    @keyframes spriteSwing {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-20deg); }
      75% { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }
    
    @keyframes spriteSweep {
      0% { transform: rotate(0deg) translateX(0); }
      50% { transform: rotate(10deg) translateX(-3px); }
      100% { transform: rotate(0deg) translateX(0); }
    }
    
    @keyframes spriteFlee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-30px); }
    }
    
    /* Animal-specific movement animations */
    @keyframes waddle {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      25% { transform: translateY(-2px) rotate(2deg); }
      50% { transform: translateY(0) rotate(-2deg); }
      75% { transform: translateY(-2px) rotate(2deg); }
    }
    
    @keyframes swim {
      0%, 100% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(2px) translateY(-1px); }
      50% { transform: translateX(0) translateY(1px); }
      75% { transform: translateX(-2px) translateY(-1px); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    @keyframes flutter {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-3px) scale(1.1) rotate(5deg); }
      50% { transform: translateY(-5px) scale(1); }
      75% { transform: translateY(-3px) scale(1.1) rotate(-5deg); }
    }
    
    /* CSS classes for animal animations */
    .animate-waddle { animation: waddle 0.8s ease-in-out infinite; }
    .animate-swim { animation: swim 1.2s ease-in-out infinite; }
    .animate-float { animation: float 2s ease-in-out infinite; }
    .animate-flutter { animation: flutter 0.6s ease-in-out infinite; }
    
    /* Predator Animations */
    @keyframes prowl {
      0%, 100% { 
        transform: translateX(0) translateY(0) scale(1);
        filter: brightness(1);
      }
      25% { 
        transform: translateX(-3px) translateY(2px) scale(1.02);
        filter: brightness(1.1);
      }
      50% { 
        transform: translateX(0) translateY(0) scale(1);
      }
      75% { 
        transform: translateX(3px) translateY(2px) scale(1.02);
        filter: brightness(1.1);
      }
    }
    
    @keyframes pounce {
      0% { 
        transform: translateX(0) translateY(0) scale(1) rotate(0deg);
      }
      30% { 
        transform: translateX(-20px) translateY(5px) scale(0.9) rotate(-5deg);
      }
      60% { 
        transform: translateX(50px) translateY(-30px) scale(1.3) rotate(10deg);
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      }
      100% { 
        transform: translateX(80px) translateY(0) scale(1.1) rotate(0deg);
      }
    }
    
    /* Bird Animations */
    @keyframes soar {
      0%, 100% { 
        transform: translateY(0) rotate(0deg);
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
      }
      25% { 
        transform: translateY(-15px) rotate(-10deg);
        filter: drop-shadow(0 15px 20px rgba(0,0,0,0.2));
      }
      50% { 
        transform: translateY(-25px) rotate(0deg);
        filter: drop-shadow(0 20px 25px rgba(0,0,0,0.15));
      }
      75% { 
        transform: translateY(-15px) rotate(10deg);
        filter: drop-shadow(0 15px 20px rgba(0,0,0,0.2));
      }
    }
    
    @keyframes dive {
      0% { 
        transform: translateY(-100px) scale(0.8) rotate(45deg);
        opacity: 0.8;
      }
      50% { 
        transform: translateY(-20px) scale(1.2) rotate(60deg);
        filter: blur(1px);
      }
      100% { 
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    
    /* Large Herbivore Animations */
    @keyframes stampede {
      0%, 100% { 
        transform: translateX(0) scaleX(1);
      }
      10%, 30%, 50%, 70% { 
        transform: translateX(0) translateY(-5px) scaleX(1.05);
      }
      20%, 40%, 60%, 80% { 
        transform: translateX(0) translateY(0) scaleX(0.95);
      }
    }
    
    @keyframes charge {
      0% { 
        transform: translateX(0) scale(1);
        filter: brightness(1);
      }
      20% { 
        transform: translateX(-30px) scale(1.1);
        filter: brightness(1.2) contrast(1.2);
      }
      60% { 
        transform: translateX(40px) scale(1.3);
        filter: brightness(1.3) contrast(1.3) blur(0.5px);
      }
      100% { 
        transform: translateX(100px) scale(1.2);
        filter: brightness(1) contrast(1);
      }
    }
    
    /* Aquatic Animations */
    @keyframes swim-attack {
      0%, 100% { 
        transform: translateX(0) translateY(0) rotate(0deg);
      }
      25% { 
        transform: translateX(10px) translateY(-5px) rotate(5deg);
      }
      50% { 
        transform: translateX(-10px) translateY(5px) rotate(-5deg);
      }
      75% { 
        transform: translateX(5px) translateY(-3px) rotate(3deg);
      }
    }
    
    @keyframes breach {
      0% { 
        transform: translateY(50px) rotate(0deg);
        opacity: 0;
      }
      40% { 
        transform: translateY(-40px) rotate(-20deg);
        opacity: 1;
      }
      70% { 
        transform: translateY(-60px) rotate(0deg);
      }
      100% { 
        transform: translateY(0) rotate(0deg);
      }
    }
    
    /* Venomous/Snake Animations */
    @keyframes slither {
      0%, 100% { 
        transform: translateX(0) scaleX(1);
      }
      25% { 
        transform: translateX(-5px) scaleX(1.1);
      }
      50% { 
        transform: translateX(5px) scaleX(0.9);
      }
      75% { 
        transform: translateX(-3px) scaleX(1.05);
      }
    }
    
    @keyframes strike {
      0% { 
        transform: translateX(0) scaleX(1);
      }
      30% { 
        transform: translateX(-20px) scaleX(0.7);
      }
      60% { 
        transform: translateX(60px) scaleX(1.5);
        filter: drop-shadow(0 0 10px rgba(128, 0, 128, 0.5));
      }
      100% { 
        transform: translateX(0) scaleX(1);
      }
    }
    
    /* Pack Animal Animations */
    @keyframes pack-circle {
      0% { 
        transform: translate(0, 0);
      }
      25% { 
        transform: translate(20px, -10px);
      }
      50% { 
        transform: translate(0, -20px);
      }
      75% { 
        transform: translate(-20px, -10px);
      }
      100% { 
        transform: translate(0, 0);
      }
    }
    
    @keyframes howl {
      0%, 100% { 
        transform: scale(1) rotate(0deg);
      }
      30% { 
        transform: scale(1.05) rotate(-5deg);
      }
      60% { 
        transform: scale(1.1) rotate(5deg);
        filter: drop-shadow(0 0 20px rgba(150, 150, 255, 0.6));
      }
    }
    
    /* Primate Animations */
    @keyframes swing {
      0%, 100% { 
        transform: translateY(0) rotate(0deg);
      }
      25% { 
        transform: translateY(-20px) rotate(-15deg);
      }
      50% { 
        transform: translateY(-30px) rotate(0deg);
      }
      75% { 
        transform: translateY(-20px) rotate(15deg);
      }
    }
    
    @keyframes pound {
      0%, 100% { 
        transform: scale(1);
      }
      25%, 75% { 
        transform: scale(1.2) translateY(-5px);
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
      }
      50% { 
        transform: scale(0.9) translateY(5px);
      }
    }
    
    /* Special Attack Effects */
    @keyframes fury {
      0%, 100% { 
        filter: hue-rotate(0deg) brightness(1);
        transform: scale(1);
      }
      25% { 
        filter: hue-rotate(20deg) brightness(1.3);
        transform: scale(1.1) rotate(5deg);
      }
      50% { 
        filter: hue-rotate(-20deg) brightness(1.5);
        transform: scale(1.2) rotate(-5deg);
      }
      75% { 
        filter: hue-rotate(10deg) brightness(1.3);
        transform: scale(1.1) rotate(3deg);
      }
    }
    
    @keyframes earthquake {
      0%, 100% { transform: translateX(0); }
      10% { transform: translateX(-2px) rotate(-1deg); }
      20% { transform: translateX(2px) rotate(1deg); }
      30% { transform: translateX(-2px) rotate(0deg); }
      40% { transform: translateX(2px) rotate(1deg); }
      50% { transform: translateX(-1px) rotate(-1deg); }
      60% { transform: translateX(1px) rotate(0deg); }
      70% { transform: translateX(-1px) rotate(1deg); }
      80% { transform: translateX(0px) rotate(-1deg); }
      90% { transform: translateX(1px) rotate(0deg); }
    }
    
    /* CSS Classes for Combat Animations */
    .animate-prowl { animation: prowl 2s ease-in-out infinite; }
    .animate-pounce { animation: pounce 0.8s ease-out; }
    .animate-soar { animation: soar 3s ease-in-out infinite; }
    .animate-dive { animation: dive 0.6s ease-out; }
    .animate-stampede { animation: stampede 1.5s ease-in-out infinite; }
    .animate-charge { animation: charge 1s ease-out; }
    .animate-swim-attack { animation: swim-attack 1.5s ease-in-out infinite; }
    .animate-breach { animation: breach 1.2s ease-out; }
    .animate-slither { animation: slither 1s ease-in-out infinite; }
    .animate-strike { animation: strike 0.6s ease-out; }
    .animate-pack-circle { animation: pack-circle 2s ease-in-out infinite; }
    .animate-howl { animation: howl 1.5s ease-in-out; }
    .animate-swing { animation: swing 2s ease-in-out infinite; }
    .animate-pound { animation: pound 0.8s ease-out; }
    .animate-fury { animation: fury 0.5s ease-in-out infinite; }
    .animate-earthquake { animation: earthquake 0.5s ease-in-out; }
    
    @keyframes shooting-star {
      0% { transform: translateX(0) translateY(0) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(-300px) translateY(200px) rotate(45deg); opacity: 0; }
    }
    
    /* Enhanced Projectile System */
    @keyframes projectileFly {
      0% { transform: translateX(0) scale(0.8); opacity: 0.9; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(400px) scale(1.2); opacity: 0; }
    }
    
    @keyframes projectileFlyReverse {
      0% { transform: translateX(0) scale(0.8); opacity: 0.9; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(-400px) scale(1.2); opacity: 0; }
    }
    
    .enhanced-projectile {
      border-radius: 50%;
      background: radial-gradient(circle, #ffd700 20%, #ffab00 50%, #ff6f00 80%);
      position: relative;
    }
    
    .enhanced-projectile::before {
      content: '';
      position: absolute;
      top: 50%;
      left: -30px;
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.8));
      border-radius: 1px;
      animation: projectileTrail 0.4s linear infinite;
    }
    
    @keyframes projectileTrail {
      0% { opacity: 0.8; transform: scaleX(1); }
      50% { opacity: 0.6; transform: scaleX(0.8); }
      100% { opacity: 0.4; transform: scaleX(0.6); }
    }
    
    /* FF6-Style Special Attack Announcement */
    .ff6-special-attack-announcement {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      
      /* FF6 Blue gradient background */
      background: linear-gradient(180deg, #4a90e2 0%, #2c5aa0 50%, #1e3a8a 100%);
      border: 3px solid #fff;
      border-radius: 8px;
      box-shadow: 
        0 0 0 2px #000,
        inset 0 2px 4px rgba(255, 255, 255, 0.3),
        0 4px 8px rgba(0, 0, 0, 0.5);
      
      /* Text styling */
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      text-shadow: 2px 2px 0px #000;
      text-align: center;
      padding: 12px 24px;
      min-width: 200px;
      
      /* Animation */
      animation: ff6Announcement 2s ease-out;
    }
    
    @keyframes ff6Announcement {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.5);
      }
      20% {
        opacity: 1;
        transform: translateX(-50%) scale(1.1);
      }
      30% {
        transform: translateX(-50%) scale(1);
      }
      85% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) scale(0.9);
      }
    }
    
    /* Enhanced Enemy Visual Effects */
    .enhanced-strong {
      filter: brightness(1.2) contrast(1.1);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }
    
    .enhanced-enraged {
      filter: brightness(1.3) hue-rotate(10deg);
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
      animation: rageGlow 1s ease-in-out infinite alternate;
    }
    
    .enhanced-elite {
      filter: brightness(1.4) contrast(1.2) saturate(1.3);
      box-shadow: 0 0 16px rgba(138, 43, 226, 0.8);
      animation: eliteGlow 2s ease-in-out infinite alternate;
    }
    
    @keyframes rageGlow {
      0% { box-shadow: 0 0 12px rgba(255, 0, 0, 0.6); }
      100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.9); }
    }
    
    @keyframes eliteGlow {
      0% { 
        box-shadow: 0 0 16px rgba(138, 43, 226, 0.8);
        transform: scale(1);
      }
      100% { 
        box-shadow: 0 0 24px rgba(138, 43, 226, 1.0);
        transform: scale(1.02);
      }
    }
    
    /* Enhanced Enemy Name Styling */
    .enhanced-strong-name {
      color: #ffd700 !important;
      text-shadow: 0 0 4px rgba(255, 215, 0, 0.5);
    }
    
    .enhanced-enraged-name {
      color: #ff4444 !important;
      text-shadow: 0 0 6px rgba(255, 68, 68, 0.7);
      animation: textRage 0.5s ease-in-out infinite alternate;
    }
    
    .enhanced-elite-name {
      color: #8a2be2 !important;
      text-shadow: 0 0 8px rgba(138, 43, 226, 0.8);
      font-weight: bold;
      animation: textElite 1.5s ease-in-out infinite alternate;
    }
    
    @keyframes textRage {
      0% { text-shadow: 0 0 6px rgba(255, 68, 68, 0.7); }
      100% { text-shadow: 0 0 10px rgba(255, 68, 68, 1.0); }
    }
    
    @keyframes textElite {
      0% { text-shadow: 0 0 8px rgba(138, 43, 226, 0.8); }
      100% { text-shadow: 0 0 12px rgba(138, 43, 226, 1.0); }
    }
  </style>
