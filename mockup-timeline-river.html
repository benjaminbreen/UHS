<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River of Time - Background Effect Mockup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: 'Garamond', 'Georgia', 'Times New Roman', serif;
      background: #000;
      position: relative;
    }

    /* Background image with gradient overlay */
    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    .background-image::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.4) 15%,
        rgba(0, 0, 0, 0.7) 40%,
        rgba(0, 0, 0, 0.9) 70%,
        rgba(0, 0, 0, 1) 100%
      );
    }

    /* Timeline container */
    .timeline-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 10vh 0;
      pointer-events: none;
    }

    /* Individual timeline rivers */
    .timeline-river {
      position: relative;
      height: 60px;
      overflow: hidden;
      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 10%,
        black 90%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 10%,
        black 90%,
        transparent 100%
      );
    }

    /* Timeline text strip */
    .timeline-text {
      position: absolute;
      white-space: nowrap;
      font-size: 16px;
      line-height: 60px;
      animation: scroll-river linear infinite;
      display: flex;
      align-items: center;
    }

    @keyframes scroll-river {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* Different speeds for each river */
    .river-1 .timeline-text {
      animation-duration: 80s;
      color: rgba(255, 223, 186, 0.7);
      font-size: 14px;
    }

    .river-2 .timeline-text {
      animation-duration: 60s;
      color: rgba(255, 248, 220, 0.8);
      font-size: 18px;
    }

    .river-3 .timeline-text {
      animation-duration: 100s;
      color: rgba(220, 220, 200, 0.6);
      font-size: 15px;
    }

    .river-4 .timeline-text {
      animation-duration: 70s;
      color: rgba(255, 250, 240, 0.75);
      font-size: 17px;
    }

    .river-5 .timeline-text {
      animation-duration: 90s;
      color: rgba(245, 245, 220, 0.65);
      font-size: 14px;
    }

    /* Timeline elements */
    .timeline-node {
      display: inline-flex;
      align-items: center;
      margin: 0 40px;
    }

    .arrow {
      color: rgba(200, 200, 200, 0.4);
      margin: 0 15px;
      font-size: 20px;
    }

    .era-marker {
      background: rgba(100, 100, 100, 0.3);
      color: rgba(255, 255, 255, 0.9);
      padding: 3px 12px;
      border-radius: 3px;
      margin: 0 20px;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .life-event {
      font-style: italic;
      opacity: 0.9;
    }

    .historical-event {
      font-weight: bold;
      color: rgba(255, 215, 0, 0.8);
      text-shadow: 0 0 4px rgba(255, 215, 0, 0.3);
    }

    .connection {
      opacity: 0.7;
      font-size: 0.9em;
    }

    /* Title overlay */
    .title-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      text-align: center;
      color: white;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 40px 60px;
      border-radius: 10px;
      backdrop-filter: blur(5px);
    }

    .title-overlay h1 {
      font-size: 3.5em;
      margin-bottom: 0.3em;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: -1px;
    }

    .title-overlay p {
      font-size: 1.3em;
      opacity: 0.9;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
      font-family: Georgia, serif;
      font-style: italic;
    }

    /* Pulse effect for certain nodes */
    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 4px currentColor; }
      50% { text-shadow: 0 0 12px currentColor; }
    }

    .historical-event {
      animation: pulse-glow 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Background Image -->
  <div class="background-image" id="bgImage"></div>

  <!-- Timeline Rivers -->
  <div class="timeline-container">
    <div class="timeline-river river-1">
      <div class="timeline-text" id="river1"></div>
    </div>
    <div class="timeline-river river-2">
      <div class="timeline-text" id="river2"></div>
    </div>
    <div class="timeline-river river-3">
      <div class="timeline-text" id="river3"></div>
    </div>
    <div class="timeline-river river-4">
      <div class="timeline-text" id="river4"></div>
    </div>
    <div class="timeline-river river-5">
      <div class="timeline-text" id="river5"></div>
    </div>
  </div>

  <!-- Title Overlay -->
  <div class="title-overlay">
    <h1>Universal History Simulator</h1>
    <p>Follow the river of time through human history</p>
  </div>

  <script>
    // Historical data
    const timelines = {
      ancient: {
        era: 'ANCIENT',
        events: [
          { name: 'Imhotep', role: 'architect', action: 'designs first pyramid' },
          { name: 'Sargon', role: 'conqueror', action: 'unites Mesopotamia' },
          { name: 'Hammurabi', role: 'lawgiver', action: 'writes first legal code' },
          { name: 'Homer', role: 'poet', action: 'composes the Iliad' },
          { name: 'Confucius', role: 'philosopher', action: 'teaches moral harmony' },
          { name: 'Buddha', role: 'sage', action: 'achieves enlightenment' },
          { name: 'Socrates', role: 'teacher', action: 'questions everything' },
          { name: 'Alexander', role: 'conqueror', action: 'reaches India' }
        ]
      },
      classical: {
        era: 'CLASSICAL',
        events: [
          { name: 'Caesar', role: 'general', action: 'crosses the Rubicon' },
          { name: 'Cleopatra', role: 'queen', action: 'rules Egypt' },
          { name: 'Jesus', role: 'teacher', action: 'preaches in Galilee' },
          { name: 'Marcus Aurelius', role: 'emperor', action: 'writes Meditations' },
          { name: 'Constantine', role: 'emperor', action: 'legalizes Christianity' },
          { name: 'Hypatia', role: 'mathematician', action: 'teaches in Alexandria' }
        ]
      },
      medieval: {
        era: 'MEDIEVAL',
        events: [
          { name: 'Muhammad', role: 'prophet', action: 'founds Islam' },
          { name: 'Charlemagne', role: 'emperor', action: 'unites Western Europe' },
          { name: 'Al-Khwarizmi', role: 'mathematician', action: 'invents algebra' },
          { name: 'William', role: 'conqueror', action: 'invades England' },
          { name: 'Saladin', role: 'sultan', action: 'retakes Jerusalem' },
          { name: 'Dante', role: 'poet', action: 'writes Divine Comedy' },
          { name: 'Marco Polo', role: 'explorer', action: 'reaches China' },
          { name: 'Joan of Arc', role: 'warrior', action: 'saves France' }
        ]
      },
      renaissance: {
        era: 'RENAISSANCE',
        events: [
          { name: 'Gutenberg', role: 'inventor', action: 'prints first book' },
          { name: 'Columbus', role: 'navigator', action: 'reaches Americas' },
          { name: 'Leonardo', role: 'genius', action: 'paints Mona Lisa' },
          { name: 'Machiavelli', role: 'adviser', action: 'writes The Prince' },
          { name: 'Luther', role: 'reformer', action: 'challenges the Church' },
          { name: 'Copernicus', role: 'astronomer', action: 'places Sun at center' },
          { name: 'Shakespeare', role: 'playwright', action: 'writes Hamlet' },
          { name: 'Galileo', role: 'scientist', action: 'sees Jupiter\'s moons' }
        ]
      },
      modern: {
        era: 'MODERN',
        events: [
          { name: 'Newton', role: 'physicist', action: 'explains gravity' },
          { name: 'Washington', role: 'general', action: 'founds republic' },
          { name: 'Napoleon', role: 'emperor', action: 'conquers Europe' },
          { name: 'Darwin', role: 'naturalist', action: 'reveals evolution' },
          { name: 'Lincoln', role: 'president', action: 'frees the enslaved' },
          { name: 'Curie', role: 'scientist', action: 'discovers radium' },
          { name: 'Einstein', role: 'physicist', action: 'redefines reality' },
          { name: 'Turing', role: 'mathematician', action: 'invents computing' }
        ]
      }
    };

    const connections = [
      'leading to', 'influencing', 'inspiring', 'followed by', 'enabling',
      'preparing for', 'setting stage for', 'culminating in', 'parallel to'
    ];

    // Random background images
    const backgrounds = [
      'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1920',
      'https://images.unsplash.com/photo-1588345921523-c2dcdb7f1dcd?w=1920',
      'https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=1920',
      'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920',
      'https://images.unsplash.com/photo-1573155993874-d5d48af862ba?w=1920',
      'https://images.unsplash.com/photo-1599946347371-68eb71b16afc?w=1920',
      'https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?w=1920',
      'https://images.unsplash.com/photo-1609710228159-0fa9bd7c0827?w=1920',
    ];

    // Set random background
    function setRandomBackground() {
      const bg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
      document.getElementById('bgImage').style.backgroundImage = `url(${bg})`;
    }

    // Generate a connected timeline
    function generateTimeline() {
      const eras = Object.keys(timelines);
      let timeline = '';

      // Create two identical sequences for seamless looping
      for (let sequence = 0; sequence < 2; sequence++) {
        eras.forEach(era => {
          const data = timelines[era];

          // Add era marker
          timeline += `<span class="era-marker">${data.era}</span>`;
          timeline += '<span class="arrow">→</span>';

          // Add 3-5 random events from this era
          const numEvents = 3 + Math.floor(Math.random() * 3);
          const shuffled = [...data.events].sort(() => Math.random() - 0.5);

          for (let i = 0; i < Math.min(numEvents, shuffled.length); i++) {
            const event = shuffled[i];
            const isHistorical = Math.random() > 0.6;

            if (isHistorical) {
              timeline += `<span class="historical-event">${event.name} ${event.action}</span>`;
            } else {
              timeline += `<span class="life-event">${event.name}, ${event.role}, ${event.action}</span>`;
            }

            if (i < numEvents - 1) {
              const connector = connections[Math.floor(Math.random() * connections.length)];
              timeline += `<span class="arrow">→</span>`;
              timeline += `<span class="connection">${connector}</span>`;
              timeline += `<span class="arrow">→</span>`;
            }
          }

          timeline += '<span class="arrow">⟹</span>';
        });
      }

      return timeline;
    }

    // Initialize rivers
    function initializeRivers() {
      for (let i = 1; i <= 5; i++) {
        const river = document.getElementById(`river${i}`);
        river.innerHTML = generateTimeline();
      }
    }

    // Refresh a river periodically
    function refreshRiver() {
      const riverNum = Math.floor(Math.random() * 5) + 1;
      const river = document.getElementById(`river${riverNum}`);
      river.innerHTML = generateTimeline();
    }

    // Initialize
    setRandomBackground();
    initializeRivers();

    // Periodically refresh rivers for variety
    setInterval(refreshRiver, 30000);
  </script>
</body>
</html>
