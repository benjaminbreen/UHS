<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Labor Simulator - Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #444;
        }

        .header-title {
            font-size: 24px;
            color: #f0a020;
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 14px;
            color: #888;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .progress-bar {
            height: 20px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #444;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #f0a020, #f0d020);
            transition: width 0.3s ease;
        }

        .progress-fill.health {
            background: linear-gradient(to right, #e74c3c, #e67e22);
        }

        .progress-fill.fatigue {
            background: linear-gradient(to right, #3498db, #9b59b6);
        }

        .progress-fill.trust {
            background: linear-gradient(to right, #2ecc71, #27ae60);
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .task-area {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #444;
        }

        .section-title {
            font-size: 18px;
            color: #f0a020;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }

        .task-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-card {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .task-card:hover {
            border-color: #f0a020;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(240, 160, 32, 0.3);
        }

        .task-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .task-card.disabled:hover {
            transform: none;
            border-color: #555;
        }

        .task-icon {
            font-size: 32px;
            text-align: center;
            margin-bottom: 8px;
        }

        .task-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }

        .task-details {
            font-size: 11px;
            color: #888;
            line-height: 1.4;
        }

        .task-timing-badge {
            display: inline-block;
            background: #f0a020;
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 5px;
        }

        .active-task {
            background: #1a2a1a;
            padding: 20px;
            border-radius: 6px;
            border: 2px solid #2ecc71;
            margin-bottom: 20px;
        }

        .active-task-title {
            font-size: 16px;
            color: #2ecc71;
            margin-bottom: 10px;
        }

        .timing-game {
            margin-top: 15px;
            padding: 15px;
            background: #0a0a0a;
            border-radius: 6px;
        }

        .timing-bar {
            height: 40px;
            background: #1a1a1a;
            border-radius: 6px;
            position: relative;
            margin-bottom: 10px;
            border: 2px solid #444;
        }

        .timing-slider {
            position: absolute;
            height: 100%;
            width: 4px;
            background: #fff;
            left: 0;
            transition: left 0.016s linear;
        }

        .timing-target {
            position: absolute;
            height: 100%;
            width: 20%;
            background: rgba(46, 204, 113, 0.3);
            border: 2px solid #2ecc71;
            left: 40%;
        }

        .timing-button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timing-button:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .timing-button:active {
            transform: scale(0.95);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .supervisor-box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #444;
        }

        .supervisor-message {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #f0a020;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 10px;
        }

        .events-log {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #444;
            max-height: 400px;
            overflow-y: auto;
        }

        .event-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.4;
        }

        .event-item.success {
            background: rgba(46, 204, 113, 0.2);
            border-left: 3px solid #2ecc71;
        }

        .event-item.warning {
            background: rgba(241, 196, 15, 0.2);
            border-left: 3px solid #f1c40f;
        }

        .event-item.danger {
            background: rgba(231, 76, 60, 0.2);
            border-left: 3px solid #e74c3c;
        }

        .event-item.info {
            background: rgba(52, 152, 219, 0.2);
            border-left: 3px solid #3498db;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            border: 3px solid #f0a020;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 24px;
            color: #f0a020;
            margin-bottom: 20px;
        }

        .modal-text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
        }

        .btn-primary {
            background: #f0a020;
            color: #000;
        }

        .btn-primary:hover {
            background: #f0b540;
        }

        .btn-secondary {
            background: #444;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #555;
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #2ecc71;
            color: #fff;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .llm-badge {
            display: inline-block;
            background: #9b59b6;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 10px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulsing {
            animation: pulse 2s infinite;
        }

        .start-screen {
            text-align: center;
            padding: 60px 20px;
        }

        .start-title {
            font-size: 36px;
            color: #f0a020;
            margin-bottom: 20px;
        }

        .factory-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .factory-option {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            border: 3px solid #444;
            cursor: pointer;
            transition: all 0.2s;
        }

        .factory-option:hover {
            border-color: #f0a020;
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(240, 160, 32, 0.4);
        }

        .factory-option-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .factory-option-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .factory-option-details {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Start screen will be injected here -->
    </div>

    <script>
        // ===== GAME STATE =====
        const gameState = {
            factoryType: null,
            factoryName: '',
            location: '',
            era: '',
            hour: 0,
            maxHours: 6, // 6-hour shift for prototype

            stats: {
                health: 100,
                maxHealth: 100,
                fatigue: 0,
                maxFatigue: 100,
                quota: 0,
                quotaTarget: 100,
                trust: 50,
                wageEarned: 0,
                tasksCompleted: 0,
                tasksFailed: 0,
                quality: 100,
                injuries: []
            },

            activeTask: null,
            taskStartTime: null,
            customEvent1Shown: false,
            customEvent2Shown: false,

            events: []
        };

        // ===== FACTORY DATA =====
        const FACTORIES = {
            textile: {
                name: 'Lowell Textile Mill',
                location: 'Lowell, Massachusetts',
                era: '1845',
                icon: '🧵',
                description: 'Cotton spinning and weaving mill. Long hours, dangerous machinery, child labor.',
                baseWage: 0.50,
                tasks: [
                    {
                        id: 'thread_bobbin',
                        name: 'Thread Bobbin',
                        icon: '🧵',
                        duration: 5,
                        quota: 2,
                        fatigue: 5,
                        risk: 0.02,
                        requiresSkill: true
                    },
                    {
                        id: 'operate_loom',
                        name: 'Operate Loom',
                        icon: '🪡',
                        duration: 10,
                        quota: 5,
                        fatigue: 10,
                        risk: 0.05
                    },
                    {
                        id: 'tie_thread',
                        name: 'Tie Broken Thread',
                        icon: '🔗',
                        duration: 3,
                        quota: 1,
                        fatigue: 3,
                        risk: 0.01
                    },
                    {
                        id: 'package_cloth',
                        name: 'Package Cloth',
                        icon: '📦',
                        duration: 7,
                        quota: 4,
                        fatigue: 6,
                        risk: 0.01
                    },
                    {
                        id: 'clean_lint',
                        name: 'Clean Lint Trap',
                        icon: '🧹',
                        duration: 5,
                        quota: 0,
                        fatigue: 4,
                        risk: 0.08
                    },
                    {
                        id: 'fetch_water',
                        name: 'Fetch Water',
                        icon: '💧',
                        duration: 5,
                        quota: 0,
                        fatigue: 8,
                        risk: 0.01
                    }
                ]
            },
            steel: {
                name: 'Pittsburgh Steel Works',
                location: 'Pittsburgh, Pennsylvania',
                era: '1892',
                icon: '🏭',
                description: 'Blast furnaces and steel production. Extreme heat, heavy injury risk.',
                baseWage: 1.50,
                tasks: [
                    {
                        id: 'pour_ladle',
                        name: 'Pour Ladle',
                        icon: '🥄',
                        duration: 10,
                        quota: 8,
                        fatigue: 15,
                        risk: 0.12,
                        requiresSkill: true
                    },
                    {
                        id: 'load_furnace',
                        name: 'Load Furnace',
                        icon: '🔥',
                        duration: 8,
                        quota: 5,
                        fatigue: 12,
                        risk: 0.10
                    },
                    {
                        id: 'clear_slag',
                        name: 'Clear Slag',
                        icon: '⚒️',
                        duration: 6,
                        quota: 3,
                        fatigue: 10,
                        risk: 0.08
                    },
                    {
                        id: 'move_ingots',
                        name: 'Move Ingots',
                        icon: '📦',
                        duration: 7,
                        quota: 4,
                        fatigue: 11,
                        risk: 0.06
                    },
                    {
                        id: 'check_temp',
                        name: 'Check Temperature',
                        icon: '🌡️',
                        duration: 4,
                        quota: 2,
                        fatigue: 5,
                        risk: 0.05
                    },
                    {
                        id: 'shovel_coal',
                        name: 'Shovel Coal',
                        icon: '⛏️',
                        duration: 12,
                        quota: 6,
                        fatigue: 18,
                        risk: 0.03
                    }
                ]
            },
            assembly: {
                name: 'Detroit Auto Plant',
                location: 'Detroit, Michigan',
                era: '1927',
                icon: '🚗',
                description: 'Ford Model T assembly line. Repetitive work, fast pace.',
                baseWage: 5.00,
                tasks: [
                    {
                        id: 'install_part',
                        name: 'Install Engine Part',
                        icon: '⚙️',
                        duration: 8,
                        quota: 6,
                        fatigue: 8,
                        risk: 0.03
                    },
                    {
                        id: 'tighten_bolts',
                        name: 'Tighten Bolts',
                        icon: '🔧',
                        duration: 5,
                        quota: 4,
                        fatigue: 6,
                        risk: 0.02,
                        requiresSkill: true
                    },
                    {
                        id: 'weld_joint',
                        name: 'Weld Joint',
                        icon: '🔥',
                        duration: 12,
                        quota: 8,
                        fatigue: 12,
                        risk: 0.08
                    },
                    {
                        id: 'inspect_quality',
                        name: 'Inspect Quality',
                        icon: '🔍',
                        duration: 6,
                        quota: 3,
                        fatigue: 5,
                        risk: 0.01
                    },
                    {
                        id: 'move_chassis',
                        name: 'Move Chassis',
                        icon: '📦',
                        duration: 10,
                        quota: 5,
                        fatigue: 14,
                        risk: 0.05
                    },
                    {
                        id: 'fetch_parts',
                        name: 'Fetch Parts',
                        icon: '🔩',
                        duration: 4,
                        quota: 0,
                        fatigue: 7,
                        risk: 0.01
                    }
                ]
            }
        };

        // ===== RENDER FUNCTIONS =====
        function renderStartScreen() {
            document.getElementById('app').innerHTML = `
                <div class="start-screen">
                    <div class="start-title">⚙️ Factory Labor Simulator ⚙️</div>
                    <p style="font-size: 16px; color: #888; margin-bottom: 40px;">
                        Experience historical factory work through pre-coded tasks and LLM-powered events
                    </p>

                    <div class="section-title">Choose Your Factory:</div>

                    <div class="factory-select" id="factorySelect">
                    </div>
                </div>

                <!-- Modal for events -->
                <div class="modal" id="eventModal">
                    <div class="modal-content" id="modalContent"></div>
                </div>
            `;

            // Add factory options with proper event listeners
            const factorySelect = document.getElementById('factorySelect');
            Object.keys(FACTORIES).forEach(key => {
                const factory = FACTORIES[key];
                const div = document.createElement('div');
                div.className = 'factory-option';
                div.innerHTML = `
                    <div class="factory-option-icon">${factory.icon}</div>
                    <div class="factory-option-name">${factory.name}</div>
                    <div class="factory-option-details">
                        ${factory.location}<br>
                        ${factory.era}<br><br>
                        ${factory.description}
                    </div>
                `;
                div.addEventListener('click', () => selectFactory(key));
                factorySelect.appendChild(div);
            });
        }

        function renderGameScreen() {
            const factory = FACTORIES[gameState.factoryType];
            const stats = gameState.stats;

            document.getElementById('app').innerHTML = `
                <div class="header">
                    <div class="header-title">${factory.icon} ${factory.name}</div>
                    <div class="header-subtitle">
                        ${factory.location} • ${factory.era} •
                        Hour ${gameState.hour + 1}/${gameState.maxHours} •
                        $${stats.wageEarned.toFixed(2)}
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-box">
                        <div class="stat-label">❤️ Health</div>
                        <div class="stat-value">${stats.health}/${stats.maxHealth}</div>
                        <div class="progress-bar">
                            <div class="progress-fill health" style="width: ${(stats.health / stats.maxHealth) * 100}%"></div>
                        </div>
                    </div>

                    <div class="stat-box">
                        <div class="stat-label">😴 Fatigue</div>
                        <div class="stat-value">${stats.fatigue}/${stats.maxFatigue}</div>
                        <div class="progress-bar">
                            <div class="progress-fill fatigue" style="width: ${(stats.fatigue / stats.maxFatigue) * 100}%"></div>
                        </div>
                    </div>

                    <div class="stat-box">
                        <div class="stat-label">📊 Quota Progress</div>
                        <div class="stat-value">${stats.quota}/${stats.quotaTarget}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(stats.quota / stats.quotaTarget) * 100}%"></div>
                        </div>
                    </div>

                    <div class="stat-box">
                        <div class="stat-label">⭐ Trust</div>
                        <div class="stat-value">${stats.trust}/100</div>
                        <div class="progress-bar">
                            <div class="progress-fill trust" style="width: ${stats.trust}%"></div>
                        </div>
                    </div>
                </div>

                <div class="main-content">
                    <div class="task-area">
                        <div class="section-title">Available Tasks</div>

                        <div id="activeTaskArea"></div>

                        <div class="task-cards" id="taskCards"></div>
                    </div>

                    <div class="sidebar">
                        <div class="supervisor-box">
                            <div class="section-title">💬 Supervisor</div>
                            <div class="supervisor-message" id="supervisorMessage">
                                Standing by...
                            </div>
                        </div>

                        <div class="events-log">
                            <div class="section-title">📜 Event Log</div>
                            <div id="eventsLog"></div>
                        </div>
                    </div>
                </div>

                <!-- Modal for events -->
                <div class="modal" id="eventModal">
                    <div class="modal-content" id="modalContent"></div>
                </div>
            `;

            renderTaskCards();
            renderActiveTask();
            renderEventsLog();
        }

        function renderTaskCards() {
            const factory = FACTORIES[gameState.factoryType];
            const taskCardsContainer = document.getElementById('taskCards');
            taskCardsContainer.innerHTML = '';

            factory.tasks.forEach(task => {
                const disabled = gameState.activeTask !== null || gameState.stats.fatigue >= 95;

                const card = document.createElement('div');
                card.className = `task-card ${disabled ? 'disabled' : ''}`;
                card.innerHTML = `
                    <div class="task-icon">${task.icon}</div>
                    <div class="task-name">${task.name}</div>
                    <div class="task-details">
                        ⏱️ ${task.duration} min<br>
                        📊 +${task.quota} quota<br>
                        😴 +${task.fatigue} fatigue<br>
                        ${task.risk > 0.05 ? '⚠️ High Risk' : ''}
                        ${task.requiresSkill ? '<div class="task-timing-badge">🎯 TIMING</div>' : ''}
                    </div>
                `;

                if (!disabled) {
                    card.addEventListener('click', () => startTask(task.id));
                    card.style.cursor = 'pointer';
                }

                taskCardsContainer.appendChild(card);
            });
        }

        function renderActiveTask() {
            const activeTaskArea = document.getElementById('activeTaskArea');

            if (!gameState.activeTask) {
                activeTaskArea.innerHTML = '';
                return;
            }

            const task = gameState.activeTask;
            const elapsed = (Date.now() - gameState.taskStartTime) / 1000;
            const progress = Math.min((elapsed / (task.duration * 6)) * 100, 100); // 6 seconds = 1 minute for prototype

            activeTaskArea.innerHTML = `
                <div class="active-task">
                    <div class="active-task-title">
                        ${task.icon} Working: ${task.name}
                    </div>
                    <div class="progress-bar" style="height: 30px;">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div id="timingGameArea"></div>
                </div>
            `;
        }

        function renderTimingGame() {
            const timingArea = document.getElementById('timingGameArea');
            if (!timingArea) return;

            timingArea.innerHTML = `
                <div class="timing-game">
                    <div style="text-align: center; margin-bottom: 10px; color: #f0a020;">
                        🎯 Click when the bar reaches the green zone!
                    </div>
                    <div class="timing-bar">
                        <div class="timing-slider" id="timingSlider"></div>
                        <div class="timing-target"></div>
                    </div>
                    <button class="timing-button" id="timingButton">CLICK NOW!</button>
                </div>
            `;

            // Start timing animation
            let position = 0;
            let direction = 1;
            gameState.timingInterval = setInterval(() => {
                position += direction * 2;
                if (position >= 100) direction = -1;
                if (position <= 0) direction = 1;

                const slider = document.getElementById('timingSlider');
                if (slider) {
                    slider.style.left = position + '%';
                }
            }, 16);

            // Add click handler for timing button
            setTimeout(() => {
                const btn = document.getElementById('timingButton');
                if (btn) {
                    btn.addEventListener('click', clickTiming);
                }
            }, 10);
        }

        function renderEventsLog() {
            const eventsLog = document.getElementById('eventsLog');
            const recentEvents = gameState.events.slice(-10).reverse();

            eventsLog.innerHTML = recentEvents.map(event => `
                <div class="event-item ${event.type}">
                    ${event.message}
                </div>
            `).join('') || '<div class="event-item info">Shift beginning...</div>';
        }

        // ===== GAME LOGIC =====
        function selectFactory(type) {
            gameState.factoryType = type;
            const factory = FACTORIES[type];
            gameState.factoryName = factory.name;
            gameState.location = factory.location;
            gameState.era = factory.era;

            // Show LLM intro modal
            showShiftStartModal();
        }

        function showShiftStartModal() {
            const factory = FACTORIES[gameState.factoryType];

            // Mock LLM response
            const mockIntros = {
                textile: `You arrive at the ${factory.name} on a cold January morning, 1845. The massive brick building looms before you, windows rattling with the thunder of hundreds of looms.

Overseer Hiram Carter, a stern man with cold eyes, looks you up and down. "You're late," he says flatly. "Get to loom #17 immediately. Quota is 100 yards today. Fall behind and you'll be fined."

The air inside is thick with cotton lint and the deafening clatter of machinery. Your 12-hour shift begins now.`,

                steel: `The heat hits you like a wall as you enter the ${factory.name}. It's already 95°F outside, but near the blast furnaces it must be 130°F. Sweat immediately begins pouring down your face.

Foreman O'Brien, his face scarred from years of molten metal splashes, barks at you: "New hand? Listen close—I only say this once. Keep your head down, don't touch the ladles until you're told, and for God's sake, stay clear of the furnace when we're tapping. I've seen too many men burned."

You nod, trying not to show fear. The shift is 12 hours. It's going to feel like forever.`,

                assembly: `You enter the massive ${factory.name} assembly hall. The Model T assembly line stretches before you like a river of metal and rubber, moving at a relentless pace. The smell of machine oil and fresh paint fills the air.

Station supervisor Mr. Henry (no relation to the Ford) glances at his stopwatch. "You've got Station 14. Install the carburetor assembly. 8 minutes per car. Every car that passes incomplete is docked from your pay. Ford pays $5 a day—best in the industry—but you work for it. Now move."

The line never stops. Your shift: 8 hours. The clock is already ticking.`
            };

            showModal({
                title: `${factory.icon} Shift Beginning <span class="llm-badge">LLM GENERATED</span>`,
                message: mockIntros[gameState.factoryType],
                buttons: [
                    { text: 'Begin Shift', class: 'btn-primary', onClick: startShift }
                ]
            });
        }

        function startShift() {
            closeModal();
            renderGameScreen();
            addEvent('Shift started. Report to your station.', 'info');
            updateSupervisor('Get to work. Quota won\'t make itself.');

            // Start hourly clock
            gameState.hourInterval = setInterval(advanceHour, 60000); // 1 minute = 1 hour for prototype
        }

        function startTask(taskId) {
            const factory = FACTORIES[gameState.factoryType];
            const task = factory.tasks.find(t => t.id === taskId);

            if (!task) return;

            gameState.activeTask = task;
            gameState.taskStartTime = Date.now();

            addEvent(`Started: ${task.name}`, 'info');
            renderGameScreen();

            // If skill task, show timing game immediately
            if (task.requiresSkill) {
                setTimeout(() => renderTimingGame(), 500);
            }

            // Complete task after duration
            gameState.taskTimeout = setTimeout(() => {
                if (!task.requiresSkill) {
                    completeTask(false); // false = not from timing game
                }
            }, task.duration * 6000); // 6 seconds per minute for prototype
        }

        function clickTiming() {
            const slider = document.getElementById('timingSlider');
            if (!slider) return;

            const position = parseFloat(slider.style.left);
            const isInGreen = position >= 40 && position <= 60;
            const isPerfect = position >= 45 && position <= 55;

            clearInterval(gameState.timingInterval);
            clearTimeout(gameState.taskTimeout);

            completeTask(true, isInGreen, isPerfect);
        }

        function completeTask(fromTiming, isGood = true, isPerfect = false) {
            const task = gameState.activeTask;
            if (!task) return;

            const stats = gameState.stats;

            // Calculate outcomes
            let quotaBonus = task.quota;
            let qualityBonus = 0;
            let message = `Completed: ${task.name}`;
            let eventType = 'success';

            if (fromTiming) {
                if (isPerfect) {
                    quotaBonus += 2;
                    qualityBonus = 5;
                    message += ' (Perfect timing! ⭐)';
                    stats.trust += 2;
                } else if (isGood) {
                    quotaBonus += 1;
                    qualityBonus = 2;
                    message += ' (Good timing)';
                    stats.trust += 1;
                } else {
                    quotaBonus = Math.floor(task.quota / 2);
                    message += ' (Missed timing ✗)';
                    eventType = 'warning';
                    stats.trust -= 1;
                }
            }

            // Apply stat changes
            stats.quota += quotaBonus;
            stats.fatigue += task.fatigue;
            stats.quality = Math.min(100, stats.quality + qualityBonus);
            stats.tasksCompleted++;

            // Check for injury
            if (Math.random() < task.risk * (1 + stats.fatigue / 100)) {
                const damage = Math.floor(Math.random() * 15) + 5;
                stats.health -= damage;
                stats.injuries.push(task.name);
                addEvent(`⚠️ Injured during ${task.name}! (-${damage} health)`, 'danger');

                if (stats.health <= 0) {
                    gameOver('injury');
                    return;
                }
            }

            // Update wage
            const factory = FACTORIES[gameState.factoryType];
            stats.wageEarned += (factory.baseWage * task.duration) / 60;

            addEvent(message, eventType);

            // Check if overfatigued
            if (stats.fatigue >= 100) {
                addEvent('⚠️ Completely exhausted! Take a rest.', 'danger');
                stats.fatigue = 95;
            }

            // Clear active task
            gameState.activeTask = null;
            renderGameScreen();

            // Maybe trigger supervisor comment
            if (Math.random() < 0.2) {
                triggerSupervisorComment();
            }
        }

        function advanceHour() {
            gameState.hour++;

            addEvent(`--- Hour ${gameState.hour} completed ---`, 'info');

            // Check for shift end
            if (gameState.hour >= gameState.maxHours) {
                endShift();
                return;
            }

            // Fatigue recovery during transition
            gameState.stats.fatigue = Math.max(0, gameState.stats.fatigue - 3);

            // Check for custom LLM event
            if (gameState.hour === 3 && !gameState.customEvent1Shown) {
                triggerCustomEvent1();
            } else if (gameState.hour === 5 && !gameState.customEvent2Shown) {
                triggerCustomEvent2();
            } else {
                // Random event
                if (Math.random() < 0.4) {
                    triggerRandomEvent();
                }
            }

            renderGameScreen();
        }

        function triggerSupervisorComment() {
            const stats = gameState.stats;
            const quotaPercent = (stats.quota / stats.quotaTarget) * 100;

            const comments = [];

            if (quotaPercent < 30) {
                comments.push("You're falling behind. Pick up the pace!");
                comments.push("At this rate, you won't make quota.");
            } else if (quotaPercent > 70) {
                comments.push("Good work. Keep it up.");
                comments.push("That's the kind of productivity I like to see.");
            }

            if (stats.trust < 30) {
                comments.push("I'm watching you closely. One more mistake...");
            } else if (stats.trust > 70) {
                comments.push("You're proving yourself reliable.");
            }

            if (stats.fatigue > 70) {
                comments.push("You look tired. Don't let it slow you down.");
            }

            if (comments.length > 0) {
                updateSupervisor(comments[Math.floor(Math.random() * comments.length)]);
            }
        }

        function triggerRandomEvent() {
            const events = [
                {
                    title: '⚠️ Machine Breakdown',
                    message: 'One of the machines has stopped working. You can try to fix it yourself (15 minutes, risky) or call the supervisor (30 minutes, safe).',
                    buttons: [
                        { text: 'Fix It Myself', class: 'btn-danger', onClick: () => {
                            closeModal();
                            addEvent('Attempting repair... (15 min lost)', 'warning');
                            if (Math.random() < 0.6) {
                                addEvent('✓ Successfully repaired the machine!', 'success');
                                gameState.stats.trust += 5;
                            } else {
                                addEvent('✗ Made it worse. Supervisor called anyway.', 'danger');
                                gameState.stats.trust -= 5;
                                gameState.stats.health -= 5;
                            }
                            renderGameScreen();
                        }},
                        { text: 'Call Supervisor', class: 'btn-secondary', onClick: () => {
                            closeModal();
                            addEvent('Supervisor called. Waiting... (30 min lost)', 'info');
                            renderGameScreen();
                        }}
                    ]
                },
                {
                    title: '🩹 Co-Worker Injured',
                    message: 'A co-worker has been injured nearby. The supervisor hasn\'t noticed. You can help them (lose 20 minutes, +trust) or continue working (no penalty).',
                    buttons: [
                        { text: 'Help Them', class: 'btn-success', onClick: () => {
                            closeModal();
                            addEvent('Helped injured co-worker (20 min lost)', 'success');
                            gameState.stats.trust += 10;
                            addEvent('Co-worker thanks you quietly.', 'info');
                            renderGameScreen();
                        }},
                        { text: 'Keep Working', class: 'btn-secondary', onClick: () => {
                            closeModal();
                            addEvent('Continued working while co-worker suffered.', 'warning');
                            gameState.stats.trust -= 5;
                            renderGameScreen();
                        }}
                    ]
                },
                {
                    title: '🔥 Fire Hazard',
                    message: 'You notice smoke coming from a pile of debris. It could be nothing, or it could start a fire. Report it (safe, lose 10 min) or ignore it (risky, no time loss)?',
                    buttons: [
                        { text: 'Report It', class: 'btn-success', onClick: () => {
                            closeModal();
                            addEvent('Reported fire hazard (10 min lost)', 'success');
                            addEvent('Supervisor: "Good eye. That could have been bad."', 'info');
                            gameState.stats.trust += 8;
                            renderGameScreen();
                        }},
                        { text: 'Ignore It', class: 'btn-danger', onClick: () => {
                            closeModal();
                            if (Math.random() < 0.3) {
                                addEvent('🔥 FIRE! The debris ignited! Chaos erupts!', 'danger');
                                gameState.stats.health -= 20;
                                gameState.stats.trust -= 15;
                                addEvent('Supervisor: "Why didn\'t you report this?!"', 'danger');
                            } else {
                                addEvent('The smoke dissipates. Nothing happened.', 'info');
                            }
                            renderGameScreen();
                        }}
                    ]
                }
            ];

            const event = events[Math.floor(Math.random() * events.length)];
            showModal(event);
        }

        function triggerCustomEvent1() {
            gameState.customEvent1Shown = true;

            const factory = FACTORIES[gameState.factoryType];

            const mockEvents = {
                textile: {
                    title: '👧 Child Labor Dilemma <span class="llm-badge">LLM GENERATED</span>',
                    message: `A young girl, no more than 10 years old, is struggling to reach the upper threads on her loom. She's crying silently, trying not to draw attention. The overseer is on the other side of the floor.

You remember when you were her age—before this work broke your spirit. You could help her, but it would cost you precious minutes on your own quota.

What do you do?`,
                    hasInput: true
                },
                steel: {
                    title: '🔥 Unsafe Conditions <span class="llm-badge">LLM GENERATED</span>',
                    message: `One of the veteran workers, Old Tom, pulls you aside during a brief lull. "See that furnace?" he says, pointing to number 4. "The brickwork is cracking. I told O'Brien three times. He says we can't afford the downtime to fix it."

"That thing cracks open during a pour, we're all dead," Tom continues. "But if we refuse to work it, we're all fired. What're you gonna do?"

What do you do?`,
                    hasInput: true
                },
                assembly: {
                    title: '🚗 Quality vs. Quota <span class="llm-badge">LLM GENERATED</span>',
                    message: `You notice that several of the carburetor assemblies you've been given are defective—the gaskets are the wrong size. If you install them, the cars will leak fuel. But replacing them means going to the parts cage, getting new ones, and falling behind on quota.

Mr. Henry isn't watching right now. You could install the bad parts and make quota, or do the right thing and take the hit.

What do you do?`,
                    hasInput: true
                }
            };

            const event = mockEvents[gameState.factoryType];

            showModal({
                title: event.title,
                message: event.message,
                hasInput: true,
                onSubmit: (response) => {
                    closeModal();

                    // Mock LLM evaluation
                    const isGoodChoice = response.toLowerCase().includes('help') ||
                                       response.toLowerCase().includes('report') ||
                                       response.toLowerCase().includes('replace') ||
                                       response.toLowerCase().includes('fix') ||
                                       response.toLowerCase().includes('right');

                    if (isGoodChoice) {
                        addEvent('Your conscience feels clear, though your quota suffered.', 'success');
                        gameState.stats.trust += 5;
                        gameState.stats.quota -= 5;
                        updateSupervisor('I saw what you did. Not sure if it was smart, but... it was decent.');
                    } else {
                        addEvent('You chose self-preservation over doing the right thing.', 'warning');
                        gameState.stats.trust -= 3;
                        gameState.stats.quota += 3;
                        updateSupervisor('Good. Keep focused on your own work.');
                    }

                    renderGameScreen();
                }
            });
        }

        function triggerCustomEvent2() {
            gameState.customEvent2Shown = true;

            const mockEvents = {
                textile: {
                    title: '🪧 Union Organizer <span class="llm-badge">LLM GENERATED</span>',
                    message: `During a brief bathroom break, a man you don't recognize approaches you. "I'm with the Textile Workers Union," he says quietly, pressing a pamphlet into your hand. "We're organizing for 10-hour days and safer conditions. Meeting tonight at McGrath's boarding house."

You know workers have been fired just for being seen talking to union organizers. But the thought of shorter days, of maybe seeing daylight...

What do you say?`,
                    hasInput: true
                },
                steel: {
                    title: '💰 Bribery Offer <span class="llm-badge">LLM GENERATED</span>',
                    message: `The purchasing agent, Mr. Walsh, corners you by the slag heap. "I've been watching you," he says. "You're a good worker. Reliable."

He glances around, then continues: "I can make sure you get the easy jobs. Away from the furnaces. Maybe even a foreman position eventually." He pauses meaningfully. "Just need you to... look the other way when I fudge the weight tickets on the scrap metal. Nobody gets hurt. You get ahead. Simple."

What do you say?`,
                    hasInput: true
                },
                assembly: {
                    title: '📊 Efficiency Study <span class="llm-badge">LLM GENERATED</span>',
                    message: `A man in a suit with a stopwatch has been watching your station for the last hour. He introduces himself as Frederick Taylor—"efficiency expert." He's timing your every movement.

"I can see you're a skilled worker," he says. "I'm going to recommend you for a 15% pay increase." Your heart leaps. Then he continues: "In exchange, you'll be expected to maintain this exact pace for the entire shift. Every worker will be trained to match your speed. Anyone who falls short will be fired."

You realize you're being asked to help speed up the entire line—and doom slower workers.

What do you say?`,
                    hasInput: true
                }
            };

            const event = mockEvents[gameState.factoryType];

            showModal({
                title: event.title,
                message: event.message,
                hasInput: true,
                onSubmit: (response) => {
                    closeModal();

                    // Mock LLM evaluation
                    const isUnionChoice = response.toLowerCase().includes('union') ||
                                        response.toLowerCase().includes('organize') ||
                                        response.toLowerCase().includes('yes') ||
                                        response.toLowerCase().includes('join');

                    const isRefusalChoice = response.toLowerCase().includes('no') ||
                                          response.toLowerCase().includes('refuse') ||
                                          response.toLowerCase().includes('decline');

                    if (isUnionChoice || response.toLowerCase().includes('report')) {
                        addEvent('You chose solidarity with fellow workers over personal safety.', 'success');
                        gameState.stats.trust -= 10;
                        addEvent('⚠️ Supervisor seems suspicious of you now.', 'warning');
                    } else if (isRefusalChoice) {
                        addEvent('You chose safety over principle.', 'info');
                    } else {
                        addEvent('You gave an ambiguous answer. Time will tell the consequences.', 'warning');
                    }

                    renderGameScreen();
                }
            });
        }

        function endShift() {
            clearInterval(gameState.hourInterval);

            const stats = gameState.stats;
            const factory = FACTORIES[gameState.factoryType];
            const quotaPercent = (stats.quota / stats.quotaTarget) * 100;
            const madeQuota = quotaPercent >= 80;

            // Calculate final wage
            let finalWage = stats.wageEarned;
            if (!madeQuota) {
                finalWage *= 0.7; // 30% penalty
            }
            if (stats.trust > 70) {
                finalWage *= 1.1; // 10% bonus
            }

            // Mock LLM assessment
            const assessments = {
                textile: `Overseer Carter approaches as the bell rings. He checks his ledger, then looks at you with those cold eyes.

"${madeQuota ? 'You made quota. Barely.' : 'You fell short. Again.'}" ${stats.injuries.length > 0 ? `He glances at your injuries. "Try not to break yourself. Hard to replace good workers."` : ''}

${stats.trust > 60 ? `"You might have a future here. Don't waste it."` : stats.trust < 40 ? `"One more day like this and you're done. Understand?"` : `"Get some rest. Tomorrow's another long day."`}

Your wage: $${finalWage.toFixed(2)} ${!madeQuota ? '(docked for missing quota)' : ''}`,

                steel: `Foreman O'Brien wipes the sweat from his face with a rag as the shift whistle blows. The heat is finally letting up as the furnaces are banked for the night.

"${madeQuota ? 'Good work today.' : 'You came up short.'}" ${stats.injuries.length > 0 ? `He notices you favoring your injuries. "Get those looked at. Can't work if you're crippled."` : ''}

${stats.trust > 60 ? `"You've got grit. Keep it up and we'll move you to the better stations."` : stats.trust < 40 ? `"I'm not convinced you belong here. Prove me wrong tomorrow."` : `"Same time tomorrow. Don't be late."`}

Your wage: $${finalWage.toFixed(2)} ${!madeQuota ? '(reduced for low output)' : ''}`,

                assembly: `Mr. Henry clicks his stopwatch as the line finally stops. The sudden silence after 6 hours of constant noise is almost deafening.

"${madeQuota ? 'Acceptable performance.' : 'Below standard.'}" ${stats.injuries.length > 0 ? `He frowns at your condition. "Medical is down the hall. Don't let it affect tomorrow's production."` : ''}

${stats.trust > 60 ? `"Mr. Ford values reliable workers. You might have a future here."` : stats.trust < 40 ? `"This is a modern facility. We don't tolerate inefficiency. Shape up."` : `"Report to the same station tomorrow at 7 AM sharp."`}

Your wage: $${finalWage.toFixed(2)} ${!madeQuota ? '(quota penalty applied)' : ''}${stats.trust > 70 ? ' (+$0.50 efficiency bonus)' : ''}`
            };

            showModal({
                title: `📊 Shift Complete <span class="llm-badge">LLM GENERATED</span>`,
                message: assessments[gameState.factoryType],
                buttons: [
                    { text: 'End Shift', class: 'btn-primary', onClick: () => {
                        closeModal();
                        renderStartScreen();
                    }},
                    { text: 'Work Another Shift', class: 'btn-secondary', onClick: () => {
                        closeModal();
                        resetForNewShift();
                    }}
                ]
            });
        }

        function resetForNewShift() {
            gameState.hour = 0;
            gameState.stats.fatigue = Math.floor(gameState.stats.fatigue / 2);
            gameState.stats.quota = 0;
            gameState.customEvent1Shown = false;
            gameState.customEvent2Shown = false;
            gameState.events = [];

            addEvent('New shift beginning...', 'info');
            renderGameScreen();

            gameState.hourInterval = setInterval(advanceHour, 60000);
        }

        function gameOver(cause) {
            clearInterval(gameState.hourInterval);
            clearInterval(gameState.timingInterval);
            clearTimeout(gameState.taskTimeout);

            const messages = {
                injury: 'You collapse from your injuries. The supervisor calls for someone to drag you out. Your shift is over—and possibly your job.',
                fatigue: 'Exhaustion overwhelms you. You black out. When you wake, you\'re outside the factory gates, unemployed.',
                fired: 'The supervisor has had enough. "You\'re done," he says. "Get out." You\'re fired.'
            };

            showModal({
                title: '💀 Shift Ended',
                message: messages[cause],
                buttons: [
                    { text: 'Try Again', class: 'btn-primary', onClick: () => {
                        closeModal();
                        renderStartScreen();
                    }}
                ]
            });
        }

        // ===== HELPER FUNCTIONS =====
        function addEvent(message, type = 'info') {
            gameState.events.push({
                message,
                type,
                timestamp: Date.now()
            });

            if (document.getElementById('eventsLog')) {
                renderEventsLog();
            }
        }

        function updateSupervisor(message) {
            const supervisorEl = document.getElementById('supervisorMessage');
            if (supervisorEl) {
                supervisorEl.innerHTML = message;
                supervisorEl.classList.add('pulsing');
                setTimeout(() => supervisorEl.classList.remove('pulsing'), 2000);
            }
        }

        function showModal({ title, message, buttons = [], hasInput = false, onSubmit = null }) {
            const modal = document.getElementById('eventModal');
            const content = document.getElementById('modalContent');

            if (!modal || !content) {
                console.error('Modal elements not found!');
                return;
            }

            let html = `
                <div class="modal-title">${title}</div>
                <div class="modal-text">${message}</div>
            `;

            if (hasInput) {
                html += `
                    <textarea class="modal-input" id="modalInput" rows="4"
                              placeholder="Type your response here..."></textarea>
                    <div class="modal-buttons">
                        <button class="btn btn-primary" id="modalSubmitBtn">
                            Submit Response
                        </button>
                    </div>
                `;
            } else {
                html += '<div class="modal-buttons" id="modalButtonsContainer"></div>';
            }

            content.innerHTML = html;

            if (hasInput) {
                gameState.modalSubmitCallback = onSubmit;
                // Add event listener for submit button
                setTimeout(() => {
                    const submitBtn = document.getElementById('modalSubmitBtn');
                    if (submitBtn) {
                        submitBtn.addEventListener('click', submitModalInput);
                    }
                }, 10);
            } else {
                // Add buttons dynamically
                const buttonContainer = document.getElementById('modalButtonsContainer');
                if (buttonContainer) {
                    buttons.forEach(btn => {
                        const button = document.createElement('button');
                        button.className = `btn ${btn.class}`;
                        button.textContent = btn.text;
                        button.addEventListener('click', btn.onClick);
                        buttonContainer.appendChild(button);
                    });
                }
            }

            modal.classList.add('active');
        }

        function submitModalInput() {
            const input = document.getElementById('modalInput');
            if (input && gameState.modalSubmitCallback) {
                const response = input.value.trim();
                if (response) {
                    gameState.modalSubmitCallback(response);
                    gameState.modalSubmitCallback = null;
                }
            }
        }

        function closeModal() {
            const modal = document.getElementById('eventModal');
            modal.classList.remove('active');
        }

        // ===== INITIALIZE =====
        renderStartScreen();
    </script>
</body>
</html>
