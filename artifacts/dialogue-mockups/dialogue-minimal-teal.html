<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UHS — Minimal teal dialogue</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&family=Silkscreen&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#091a22;color:#d5f0df;font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:28px}.wrap{width:min(820px,100%)}.tag{font:10px Silkscreen;color:#79b8a5;letter-spacing:.1em;margin-bottom:12px}.panel{background:#102c35;border:1px solid #66b49a;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));padding:21px 25px 20px;box-shadow:10px 10px 0 #061219,0 16px 34px #0008}.head{display:flex;align-items:center;gap:15px}.portrait-slot{width:56px;height:56px;border:2px solid #7be0b7;background:#204957;display:grid;place-items:center;position:relative}.portrait-slot:before{content:"";width:24px;height:34px;background:#c89170;border:3px solid #172c3a;box-shadow:0 -8px 0 1px #58444c}.name{font-size:22px;font-weight:600;letter-spacing:.02em}.facts{font:11px Silkscreen;color:#8dd0b5;margin-top:5px}.rule{height:1px;background:#4a8579;margin:16px 0 0}.speech p{font-size:25px;line-height:1.45;margin:22px 0 24px;max-width:690px}.speech em{color:#83e0bc;font-style:normal}.actions{display:flex;justify-content:flex-end;gap:9px}.actions button{font:11px Silkscreen;border:1px solid #66b49a;color:#d5f0df;background:transparent;padding:10px 13px}.actions button:first-child{background:#24735f;border-color:#7be0b7}.actions button:hover{background:#3a8f76}.reply{display:none;gap:8px;margin-top:12px}.reply.open{display:flex}.reply input{flex:1;min-width:0;background:#081a22;border:1px solid #66b49a;color:#d5f0df;padding:10px;font:16px 'DM Sans'}.reply button{border:0;background:#7be0b7;color:#09211f;padding:0 14px;font:11px Silkscreen}@media(max-width:540px){body{padding:12px}.panel{padding:16px}.speech p{font-size:20px}.name{font-size:18px}.facts{font-size:8px}}
</style></head><body><main class="wrap"><div class="tag">DIALOGUE / RIVER NIGHT</div><section class="panel"><header class="head"><div class="portrait-slot" aria-label="Existing portrait asset"></div><div><div class="name">Ayşe</div><div class="facts">F · 28 · grain keeper</div></div></header><div class="rule"></div><div class="speech"><p>“The old hearth is not yours to open. <em>Tell me who sent you.</em>”</p><div class="actions"><button type="button" onclick="toggleReply()">respond</button><button type="button">continue&nbsp; →</button></div><form class="reply" onsubmit="return false"><input aria-label="Your response" placeholder="Speak to Ayşe…"><button>send</button></form></div></section></main><script>function toggleReply(){const r=document.querySelector('.reply');r.classList.toggle('open');if(r.classList.contains('open'))r.querySelector('input').focus()}</script></body></html>
