<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UHS — Minimal warm dialogue</title><style>
@font-face{font-family:bask;src:url('/fonts/Baskervville-Regular.ttf')}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111827;color:#f3e5ca;font-family:bask,Georgia,serif;display:grid;place-items:center;padding:28px}.wrap{width:min(760px,100%)}.tag{font:11px Georgia,serif;color:#b9a98e;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px 4px}.panel{background:#e4d0a8;color:#2b2830;padding:6px;box-shadow:0 18px 35px #0008}.inner{border:1px solid #685746;padding:20px 23px 16px;background:#eadbbd;position:relative}.inner:before{content:"";position:absolute;inset:6px;border:1px solid #b39a6b;pointer-events:none}.head{display:flex;align-items:center;gap:14px;border-bottom:1px solid #a68d61;padding-bottom:12px}.portrait-slot{width:50px;height:50px;border:2px solid #574a46;background:#b9aa88;display:grid;place-items:center}.portrait-slot:before{content:"";width:22px;height:30px;background:#d6a77b;border:3px solid #433b42;box-shadow:0 -8px 0 1px #655049}.name{font-size:24px;line-height:1}.facts{font:11px Georgia,serif;color:#6d5947;margin-top:6px;letter-spacing:.04em}.speech p{font-size:26px;line-height:1.4;margin:24px 0 25px;max-width:650px}.speech em{color:#8f5c3f;font-style:normal}.actions{display:flex;justify-content:flex-end;gap:9px}.actions button{border:1px solid #685746;color:#3a3030;background:transparent;padding:9px 14px;font:11px Georgia,serif;letter-spacing:.08em;text-transform:uppercase}.actions button:first-child{background:#493e4a;color:#f4e6c9;border-color:#493e4a}.actions button:hover{background:#755d4d;color:#fff}.reply{display:none;gap:8px;margin-top:12px}.reply.open{display:flex}.reply input{flex:1;min-width:0;border:1px solid #907654;background:#f5ead0;color:#2b2830;padding:10px;font:16px bask}.reply button{background:#493e4a;border:0;color:#f4e6c9;padding:0 14px;font:11px Georgia,serif;text-transform:uppercase}@media(max-width:540px){body{padding:12px}.inner{padding:15px}.speech p{font-size:20px}.name{font-size:19px}}
</style></head><body><main class="wrap"><div class="tag">Dialogue / warm relic</div><section class="panel"><div class="inner"><header class="head"><div class="portrait-slot" aria-label="Existing portrait asset"></div><div><div class="name">Marcia</div><div class="facts">F · 34 · olive seller</div></div></header><div class="speech"><p>“You are bound for the town? Then keep to the stones when the light turns red. <em>The marsh takes the careless.</em>”</p><div class="actions"><button type="button" onclick="toggleReply()">respond</button><button type="button">continue&nbsp; ›</button></div><form class="reply" onsubmit="return false"><input aria-label="Your response" placeholder="Speak to Marcia…"><button>send</button></form></div></div></section></main><script>function toggleReply(){const r=document.querySelector('.reply');r.classList.toggle('open');if(r.classList.contains('open'))r.querySelector('input').focus()}</script></body></html>
