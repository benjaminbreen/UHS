<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UHS — Combined dialogue / Minimal</title><style>
@font-face{font-family:bask;src:url('/fonts/Baskervville-Regular.ttf')}@import url('https://fonts.googleapis.com/css2?family=Silkscreen&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10172a;color:#f0e6cf;font-family:bask,Georgia,serif;display:grid;place-items:center;padding:28px}.wrap{width:min(800px,100%)}.tag{font:10px Georgia,serif;letter-spacing:.15em;text-transform:uppercase;color:#a7b6cc;margin:0 0 12px 5px}.panel{position:relative;background:linear-gradient(120deg,#1e3150,#121d35 64%,#172a43);border:1px solid #d9b477;border-radius:16px;padding:7px 7px 7px 0;box-shadow:0 12px 30px #0007}.panel:after{content:"";position:absolute;inset:6px;border:1px solid #a68c5c66;border-radius:11px;pointer-events:none}.inner{position:relative;border:1px solid #627b9d;border-radius:10px;padding:20px 24px 17px 75px}.portrait-slot{position:absolute;left:-43px;top:20px;width:86px;height:95px;border:2px solid #d9b477;border-radius:13px;background:#304762;display:grid;place-items:center;box-shadow:4px 5px 0 #0b1120}.portrait-slot:before{content:"";width:35px;height:48px;background:#c99470;border:5px solid #393346;box-shadow:0 -13px 0 1px #5b4748}.head{border-bottom:1px solid #8394b255;padding-bottom:11px}.name{font-size:25px}.facts{font:11px Silkscreen,monospace;color:#d9b477;margin-top:7px;letter-spacing:.04em}.speech p{font-size:26px;line-height:1.42;margin:23px 0 25px;max-width:670px}.speech em{font-style:normal;color:#e5bd80}.actions{display:flex;justify-content:flex-end;gap:9px}.actions button{border:1px solid #a68c5c;border-radius:9px;background:#172741;color:#f0e6cf;padding:10px 15px;font:11px Silkscreen,monospace;letter-spacing:.04em;text-transform:uppercase}.actions button:first-child{background:#263b62}.actions button:hover{border-color:#f0e6cf}.reply{display:none;gap:8px;margin-top:12px}.reply.open{display:flex}.reply input{flex:1;min-width:0;background:#0b1120;border:1px solid #8394b2;border-radius:8px;color:#f0e6cf;padding:10px;font:16px bask}.reply button{border:0;border-radius:8px;background:#d9b477;color:#10172a;padding:0 14px;font:11px Silkscreen,monospace}@media(max-width:540px){body{padding:12px}.inner{padding:16px 13px 14px 52px}.portrait-slot{left:-30px;width:62px;height:78px}.portrait-slot:before{transform:scale(.7)}.speech p{font-size:20px}.name{font-size:19px}.facts{font-size:9px}.actions button{font-size:9px;padding:9px 10px}}
</style></head><body><main class="wrap"><div class="tag">Dialogue / combined look / minimal</div><section class="panel"><div class="inner"><div class="portrait-slot" aria-label="Existing portrait asset"></div><header class="head"><div class="name">Marcia</div><div class="facts">Female · 34 · Olive Seller</div></header><div class="speech"><p>“You are bound for the town? Then keep to the stones when the light turns red. <em>The marsh takes the careless.</em>”</p><div class="actions"><button type="button" onclick="toggleReply()">respond</button><button type="button">continue&nbsp; ›</button></div><form class="reply" onsubmit="return false"><input aria-label="Your response" placeholder="Speak to Marcia…"><button>send</button></form></div></div></section></main><script>function toggleReply(){const r=document.querySelector('.reply');r.classList.toggle('open');if(r.classList.contains('open'))r.querySelector('input').focus()}</script></body></html>
