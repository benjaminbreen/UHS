<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UHS — Dialogue option 01</title><style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400&display=swap');@font-face{font-family:bask;src:url('/fonts/Baskervville-Regular.ttf')}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1120;color:#f0e6cf;font-family:bask,Georgia,serif;display:grid;place-items:center;padding:28px}.frame{width:min(1120px,100%);border:1px solid #a68c5c;border-radius:6px;padding:26px;background:#0f1526;box-shadow:inset 0 0 0 1px #0008,0 16px 48px #0008}.label{font:10px Silkscreen,monospace;color:#a7b6cc;letter-spacing:.08em;margin-bottom:14px}.panel{position:relative;display:grid;grid-template-columns:150px 1fr;gap:23px;border:3px solid #d9b477;border-radius:4px;padding:17px 22px 16px;background:linear-gradient(110deg,#1c2c4b,#101a30);box-shadow:inset 0 0 0 2px #10182a,inset 0 0 0 5px #a68c5c44,0 8px 0 #080d19}.panel:before,.panel:after{content:"";position:absolute;width:10px;height:10px;border-color:#d9b477;border-style:solid}.panel:before{left:6px;top:6px;border-width:2px 0 0 2px}.panel:after{right:6px;bottom:6px;border-width:0 2px 2px 0}.portrait-slot{height:126px;border:2px solid #d9b477;background:#2b3b55;display:grid;place-items:center;position:relative;overflow:hidden}.portrait-slot:before{content:"";width:48px;height:64px;border:6px solid #33364a;background:#c18c69;box-shadow:0 -17px 0 3px #52434a}.portrait-slot span{position:absolute;bottom:6px;font:8px Silkscreen;color:#d9b477}.person{font-size:22px;color:#f0e6cf}.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;color:#d9b477;font:10px Silkscreen,monospace}.speech{min-width:0}.speech p{font-size:25px;line-height:1.38;margin:25px 0 25px;max-width:760px}.speech p em{font-style:normal;color:#e5bd80}.actions{display:flex;justify-content:flex-end;gap:9px}.actions button{border:1px solid #a68c5c;background:#172741;color:#f0e6cf;padding:9px 16px;font:11px Silkscreen,monospace}.actions button:hover{background:#2b4167;border-color:#f0e6cf}.reply{display:none;margin-top:12px;gap:8px}.reply.open{display:flex}.reply input{flex:1;min-width:0;background:#0b1120;border:1px solid #8394b2;color:#f0e6cf;padding:11px 12px;font:16px bask}.reply button{border:1px solid #d9b477;background:#263b62;padding:0 14px;font:10px Silkscreen}.n{font:10px Silkscreen;color:#a7b6cc;align-self:center}@media(max-width:600px){body{padding:12px}.frame{padding:12px}.panel{grid-template-columns:72px 1fr;gap:13px;padding:12px}.portrait-slot{height:92px}.portrait-slot:before{transform:scale(.65)}.speech p{font-size:19px;margin:15px 0}.facts{font-size:8px;gap:5px}.actions button{padding:9px 8px;font-size:9px}.reply{grid-column:1/-1}}
</style></head><body><main class="frame"><div class="label">DIALOGUE · OPTION 01 · WIDE BOTTOM BAR</div><section class="panel"><div><div class="portrait-slot"><span>portrait asset</span></div><div class="person">Marcia</div><div class="facts">F · 34<br>olive seller</div></div><div class="speech"><p>“You are bound for the town? Then keep to the stones when the light turns red. <em>The marsh takes the careless.</em>”</p><div class="actions"><button onclick="toggleReply()">respond</button><button>continue&nbsp; ▸</button></div><form class="reply" onsubmit="return false"><input aria-label="Your response" placeholder="Speak to Marcia…"><button>send</button></form></div></section></main><script>function toggleReply(){document.querySelector('.reply').classList.toggle('open');if(document.querySelector('.reply.open'))document.querySelector('input').focus()}</script></body></html>
